services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sehatsetu
      POSTGRES_PASSWORD: sehatsetu
      POSTGRES_DB: sehatsetu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sehatsetu"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://sehatsetu:sehatsetu@db:5432/sehatsetu
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://server:8000
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
